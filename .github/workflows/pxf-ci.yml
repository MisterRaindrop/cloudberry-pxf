name: PXF CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "11"
  JAVA_HOME: "/usr/lib/jvm/java-11-openjdk"
  GPADMIN_HOME: "/home/gpadmin"
  GO_VERSION: "1.21"
  GPHOME: "/usr/local/cloudberry-db"
  CLOUDBERRY_VERSION: "main"
  PXF_HOME: "/usr/local/pxf"
  PXF_VERSION: "main"
  # Common environment setup script
  SETUP_ENV_SCRIPT: |
    if [ -f "/usr/local/cloudberry-db/cloudberry-env.sh" ]; then
      source /usr/local/cloudberry-db/cloudberry-env.sh
    fi
    export GPHOME=/usr/local/cloudberry-db
    export PXF_HOME=/usr/local/pxf
    export JAVA_HOME=${JAVA_HOME:-/usr/lib/jvm/java-11-openjdk}
    export CLOUDBERRY_SRC="${GITHUB_WORKSPACE}/cloudberry"
    export PATH="$PATH:/usr/local/go/bin:${GPHOME}/bin"
    export LD_LIBRARY_PATH="${GPHOME}/lib:${LD_LIBRARY_PATH}"
    echo "GPHOME=$GPHOME" >> "$GITHUB_ENV"
    echo "PXF_HOME=$PXF_HOME" >> "$GITHUB_ENV"
    echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
    echo "CLOUDBERRY_SRC=$CLOUDBERRY_SRC" >> "$GITHUB_ENV"
    echo "PATH=$PATH" >> "$GITHUB_ENV"
    echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

jobs:
  # 1) Setup Apache Cloudberry Demo
  setup-cloudberry:
    name: Setup Apache Cloudberry Demo
    runs-on: ubuntu-latest
    container:
      image: apache/incubator-cloudberry:cbdb-build-rocky9-latest
      options: >-
        --user root
        -h cdw
        --shm-size=2gb
    steps:
      - name: Cloudberry Environment Initialization
        shell: bash
        run: |
          if ! su - gpadmin -c "/tmp/init_system.sh"; then
            echo "::error::Container initialization failed"
            exit 1
          fi
          mkdir -p build-logs/details
          chown -R gpadmin:gpadmin .
          chmod -R 755 .
          chmod 777 build-logs

      - name: Checkout Apache Cloudberry source
        uses: actions/checkout@v4
        with:
          repository: apache/cloudberry
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: cloudberry
          submodules: true

      - name: Configure Apache Cloudberry
        env:
          SRC_DIR: ${{ github.workspace }}/cloudberry
          BUILD_DESTINATION: /usr/local/cloudberry-db
          LOGS_DIR: build-logs
        run: |
          set -eo pipefail
          mkdir -p "${SRC_DIR}/${LOGS_DIR}" "${SRC_DIR}/${LOGS_DIR}/details"
          chown -R gpadmin:gpadmin "${SRC_DIR}"
          chmod -R 755 "${SRC_DIR}"
          chmod 777 "${SRC_DIR}/${LOGS_DIR}"
          chmod +x "${SRC_DIR}"/devops/build/automation/cloudberry/scripts/configure-cloudberry.sh
          if ! time su - gpadmin -c "cd ${SRC_DIR} && SRC_DIR=${SRC_DIR} ENABLE_DEBUG=${{ env.ENABLE_DEBUG }} ${SRC_DIR}/devops/build/automation/cloudberry/scripts/configure-cloudberry.sh"; then
            echo "::error::Configure script failed"
            exit 1
          fi

      - name: Build Apache Cloudberry
        env:
          SRC_DIR: ${{ github.workspace }}/cloudberry
        run: |
          set -eo pipefail
          chmod +x "${SRC_DIR}"/devops/build/automation/cloudberry/scripts/build-cloudberry.sh
          if ! time su - gpadmin -c "cd ${SRC_DIR} && SRC_DIR=${SRC_DIR} ${SRC_DIR}/devops/build/automation/cloudberry/scripts/build-cloudberry.sh"; then
            echo "::error::Build script failed"
            exit 1
          fi

      - name: Create Cloudberry demo cluster
        env:
          SRC_DIR: ${{ github.workspace }}/cloudberry
          NUM_PRIMARY_MIRROR_PAIRS: 1
        run: |
          set -eo pipefail
          su - gpadmin -c "
            set -eo pipefail
            cd ${SRC_DIR}
            export SRC_DIR=${SRC_DIR}
            export NUM_PRIMARY_MIRROR_PAIRS=${NUM_PRIMARY_MIRROR_PAIRS}
            chmod +x devops/build/automation/cloudberry/scripts/create-cloudberry-demo-cluster.sh
            ./devops/build/automation/cloudberry/scripts/create-cloudberry-demo-cluster.sh
          "

      - name: Verify Cloudberry cluster
        run: |
          set -eo pipefail
          su - gpadmin -c "
            source /usr/local/cloudberry-db/cloudberry-env.sh
            source ${GITHUB_WORKSPACE}/cloudberry/gpAux/gpdemo/gpdemo-env.sh
            gpstate -s
            psql -d postgres -c 'SELECT version();'
            psql -d postgres -c 'SELECT * FROM gp_segment_configuration;'
          "

      - name: Checkout current PXF source for packaging
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: cloudberry-pxf

      - name: Prepare PXF source for gpadmin
        run: |
          rm -rf ${{ env.GPADMIN_HOME }}/cloudberry-pxf
          mkdir -p ${{ env.GPADMIN_HOME }}
          cp -a cloudberry-pxf ${{ env.GPADMIN_HOME }}/cloudberry-pxf
          chown -R gpadmin:gpadmin ${{ env.GPADMIN_HOME }}/cloudberry-pxf

      - name: Install RPM packaging tools
        run: |
          dnf install -y --allowerasing rpm maven nmap-ncat java-11-openjdk-devel make coreutils findutils golang \
            gcc gcc-c++ curl-devel postgresql-devel rpm-build rpm-devel libtool autoconf automake \
            git wget tar gzip which
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk
          export PATH=\$JAVA_HOME/bin:\$PATH
          echo 'export JAVA_HOME=/usr/lib/jvm/java-11-openjdk' >> /home/gpadmin/.bashrc
          echo 'export PATH=\$JAVA_HOME/bin:\$PATH' >> /home/gpadmin/.bashrc

      - name: Build PXF components for packaging
        run: |
          set -eo pipefail
          su - gpadmin -c "
            source /usr/local/cloudberry-db/cloudberry-env.sh
            cd ${{ env.GPADMIN_HOME }}/cloudberry-pxf

            # Build all components
            make -C cli
            make -C external-table
            make -C server clean build

            # Build FDW if supported
            if make -C fdw 2>/dev/null; then
              echo 'FDW built successfully'
            else
              echo 'FDW build skipped or failed'
            fi
          "

      - name: Create RPM package
        id: create_rpm
        run: |
          set -eo pipefail
          su - gpadmin -c "
            export PATH=/usr/bin:/bin:/usr/sbin:/sbin:\$PATH
            source /usr/local/cloudberry-db/cloudberry-env.sh
            cd ${{ env.GPADMIN_HOME }}/cloudberry-pxf

            # Create RPM package
            make rpm

            # Find the created RPM file
            RPM_FILE=\$(find build/rpmbuild/RPMS -name '*.rpm' | head -1)
            if [ -n \"\$RPM_FILE\" ]; then
              echo \"rpm_file=\$RPM_FILE\" >> \$GITHUB_OUTPUT
              echo \"RPM package created: \$RPM_FILE\"
              ls -la \$RPM_FILE
            else
              echo \"No RPM file found\"
              exit 1
            fi
          "

      - name: Create RPM tarball for distribution
        run: |
          set -eo pipefail
          su - gpadmin -c "
            cd ${{ env.GPADMIN_HOME }}/cloudberry-pxf

            # Create RPM tarball with install scripts
            make rpm-tar

            # Find the created tarball
            TAR_FILE=\$(find build/distrpm/ -name '*.tar.gz' | head -1)
            if [ -n \"\$TAR_FILE\" ]; then
              echo \"Tarball created: \$TAR_FILE\"
              ls -la \$TAR_FILE
            fi
          "

      - name: Save PXF RPM package for next job
        run: |
          mkdir -p /tmp/pxf-rpm-artifacts
          cp ${{ env.GPADMIN_HOME }}/cloudberry-pxf/build/rpmbuild/RPMS/*.rpm /tmp/pxf-rpm-artifacts/ || true
          cp ${{ env.GPADMIN_HOME }}/cloudberry-pxf/build/distrpm/*.tar.gz /tmp/pxf-rpm-artifacts/ || true
          ls -la /tmp/pxf-rpm-artifacts/

  # 2) Build Hadoop Services Image
  build-hadoop-services:
    name: Build Hadoop Services Image
    runs-on: ubuntu-latest
    needs: setup-cloudberry
    steps:
      - name: Checkout current PXF source
        uses: actions/checkout@v4
        with:
          path: cloudberry-pxf

      - name: Build singlecluster image
        working-directory: cloudberry-pxf/automation
        run: |
          echo "Building pxf/singlecluster:3 image..."
          docker build -f docker/singlecluster/Dockerfile -t pxf/singlecluster:3 .

      - name: Save images to cache
        run: |
          mkdir -p /tmp/docker-images
          docker save pxf/singlecluster:3 | gzip > /tmp/docker-images/singlecluster.tar.gz

      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: pxf-docker-images-${{ github.sha }}
          restore-keys: |
            pxf-docker-images-

  # 3) Build, Install, Start and Test PXF (per your commands)
  pxf-build-install-test:
    name: Build, Install & Test PXF
    runs-on: ubuntu-latest
    needs: [setup-cloudberry, build-hadoop-services]
    steps:
      - name: Create shared network
        run: docker network create pxf-test-network
      - name: Deploy Cloudberry
        run: |
          docker run -it \
              --privileged \
              --user root \
              --hostname cdw \
              --shm-size=2gb \
              --ulimit core=-1 \
              --name cloudberry-pxf \
              --network pxf-test-network \
              apache/incubator-cloudberry:cbdb-build-rocky9-latest \
              /bin/bash
              tail -f /dev/null
      - name: Install required tools
        run: |
          docker exec cloudberry-pxf dnf install -y --allowerasing rpm maven nmap-ncat java-11-openjdk-devel make coreutils findutils

      - name: Restore PXF RPM artifacts
        run: |
            mkdir -p /tmp/pxf-rpm
            if [ -d "/tmp/pxf-rpm-artifacts" ]; then
              cp /tmp/pxf-rpm-artifacts/* /tmp/pxf-rpm/
              ls -la /tmp/pxf-rpm/
            else
              echo "No PXF RPM artifacts found"
              exit 1
            fi
      - name: Download and Install PXF RPM package
        run: |
          docker cp /tmp/pxf-rpm/ cloudberry-pxf:/tmp/pxf-rpm/
          docker exec cloudberry-pxf bash -c "
            set -eo pipefail
            RPM_FILE=\$(find /tmp/pxf-rpm/ -name '*.rpm' | head -1)
            if [ -n \"\$RPM_FILE\" ]; then
              echo \"Installing PXF from RPM package: \$RPM_FILE\"
              rpm -ivh \"\$RPM_FILE\"
              chown -R gpadmin:gpadmin /usr/local/pxf-cbdb*
              ln -sf /usr/local/pxf-cbdb* /usr/local/pxf
              echo \"PXF installed successfully from RPM package\"
            else
              echo \"No RPM package found\"
              exit 1
            fi
          "


      - name: Setup Cloudberry environment for testing
        run: |
          # Initialize container environment
          docker exec cloudberry-pxf bash -c "
            if ! su - gpadmin -c "/tmp/init_system.sh"; then
              echo "::error::Container initialization failed"
              exit 1
            fi
            eval "$SETUP_ENV_SCRIPT"
            chown -R gpadmin:gpadmin /usr/local/pxf* || true
          "

      - name: Initialize and start PXF service
        run: |
          docker exec cloudberry-pxf su - gpadmin -c "
            set -eo pipefail
            su - gpadmin -c "
              set -eo pipefail
              export PXF_HOME=/usr/local/pxf
              export PXF_BASE=\$HOME/pxf-base
              export PATH=/usr/local/pxf/bin:\$PATH

              # Initialize PXF
              pxf prepare
              pxf start

              # Verify PXF is running
              pxf status
            "
          "

      - name: Restore Docker images from cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: pxf-docker-images-${{ github.sha }}
          restore-keys: |
            pxf-docker-images-

      - name: Load and start Hadoop services container
        run: |
          # Restore and load Docker images
          if [ -f /tmp/docker-images/singlecluster.tar.gz ]; then
            echo "Loading singlecluster image..."
            docker load < /tmp/docker-images/singlecluster.tar.gz
            docker images | grep singlecluster
          else
            echo "No cached singlecluster image found"
            exit 1
          fi

          # Start Hadoop services container
          echo "Starting Hadoop services container..."
          docker run -d \
            --name hadoop-services \
            --hostname hadoop-services \
            --network pxf-test-network \
            -p 9000:9000 \
            -p 9870:9870 \
            -p 8088:8088 \
            -p 2181:2181 \
            -p 9083:9083 \
            -p 16000:16000 \
            -p 16010:16010 \
            pxf/singlecluster:3

          # Wait for services to be ready
          echo "Waiting for Hadoop services to be ready..."
          timeout 300 bash -c 'until docker exec hadoop-services nc -z localhost 9000; do sleep 10; done'
          echo "Hadoop services are ready!"

      - name: Configure Hadoop services connection
        run: |
          su - gpadmin -c "
            # Configure Hadoop connection to services
            export GPHD_ROOT=/tmp/hadoop-services
            mkdir -p \$GPHD_ROOT/conf

            # Create configuration files pointing to service containers
            cat > \$GPHD_ROOT/conf/core-site.xml << EOF
            <?xml version=\"1.0\"?>
            <configuration>
              <property>
                <name>fs.defaultFS</name>
                <value>hdfs://hadoop-services:9000</value>
              </property>
            </configuration>
            EOF

            cat > \$GPHD_ROOT/conf/hbase-site.xml << EOF
            <?xml version=\"1.0\"?>
            <configuration>
              <property>
                <name>hbase.zookeeper.quorum</name>
                <value>hadoop-services:2181</value>
              </property>
            </configuration>
            EOF
          "

      - name: Wait for Hadoop services to be ready
        run: |
          echo "Waiting for Hadoop services to be ready..."
          timeout 300 bash -c 'until nc -z hadoop-services 9000; do sleep 5; done'
          timeout 300 bash -c 'until nc -z hadoop-services 2181; do sleep 5; done'
          timeout 300 bash -c 'until nc -z hadoop-services 16000; do sleep 5; done'
          echo "All Hadoop services are ready!"

      - name: Run PXF automation tests (enhanced)
        id: automation_tests
        continue-on-error: true
        if: always()
        run: |
          docker exec cloudberry-pxf su - gpadmin -c "
            set -eo pipefail
            dnf install -y maven netcat-openbsd
            su - gpadmin -c "
              set -eo pipefail
              export PXF_HOME=/usr/local/pxf
              export PXF_BASE=\$HOME/pxf-base
              export PATH=/usr/local/pxf/bin:\$PATH
              export GPHD_ROOT=/tmp/hadoop-services
              
              cd ~/cloudberry-pxf/automation
              
              # Prepare test environment
              mkdir -p \${PXF_BASE}/servers/default
              cp \${PXF_HOME}/templates/{hdfs,mapred,yarn,core,hbase,hive}-site.xml \${PXF_BASE}/servers/default || true
              
              # Update configuration files to point to service containers
              sed -i 's/localhost/hadoop-services/g' \${PXF_BASE}/servers/default/*.xml || true
              
              # Create test artifacts directories
              mkdir -p ./test_artifacts/surefire-reports
              mkdir -p ./test_artifacts/automation_logs
              
              # Run tests
              mvn clean compile -DskipTests || echo 'Compile issues detected'
              mvn test -DtestFailureIgnore=true || echo 'Some tests failed but continuing'
              
              # Collect test results
              cp -r target/surefire-reports/* ./test_artifacts/surefire-reports/ 2>/dev/null || echo 'No surefire reports'
              cp -r automation_logs/* ./test_artifacts/automation_logs/ 2>/dev/null || echo 'No automation logs'
            "
          "

      - name: Collect and upload artifacts
        if: always()
        run: |
          # Copy files from docker container first
          docker cp cloudberry-pxf:${{ env.GPADMIN_HOME }}/pxf-base/log ./temp-pxf-base-log 2>/dev/null || true
          docker cp cloudberry-pxf:${{ env.GPADMIN_HOME }}/cloudberry-pxf/server/build/reports/tests/test ./temp-test-reports 2>/dev/null || true
          docker cp cloudberry-pxf:${{ env.GPADMIN_HOME }}/cloudberry-pxf/automation/test_artifacts ./temp-test-artifacts 2>/dev/null || true
          mkdir -p artifacts/logs
          # Always create a manifest to ensure non-empty artifact bundle
          echo "PXF artifacts bundle" > artifacts/manifest.txt
          # Collect common outputs
          cp -r ${{ env.GPADMIN_HOME }}/pxf-base/log/* artifacts/logs/ 2>/dev/null || true
          cp -r ${{ env.GPADMIN_HOME }}/cloudberry-pxf/server/build/reports/tests/test artifacts/ 2>/dev/null || true
          # Collect automation test results
          cp -r ${{ env.GPADMIN_HOME }}/cloudberry-pxf/automation/test_artifacts/* artifacts/ 2>/dev/null || true
          # Record collected files (if any) into manifest
          find artifacts -type f -print >> artifacts/manifest.txt 2>/dev/null || true
        shell: bash

      - name: Upload PXF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pxf-build-install-test-artifacts
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Evaluate module build/test results
        if: always()
        env:
          BUILD_CLI: ${{ steps.build_pxf_cli.outcome }}
          BUILD_FDW: ${{ steps.build_pxf_fdw.outcome }}
          BUILD_EXTERNAL: ${{ steps.build_pxf_external.outcome }}
          BUILD_SERVER: ${{ steps.build_pxf_server.outcome }}
          TEST_CLI: ${{ steps.test_pxf_cli.outcome }}
          TEST_FDW: ${{ steps.test_pxf_fdw.outcome }}
          TEST_EXTERNAL: ${{ steps.test_pxf_external.outcome }}
          TEST_SERVER: ${{ steps.test_pxf_server.outcome }}
          INSTALL_PXF: ${{ steps.install_pxf.outcome }}
          START_PXF: ${{ steps.start_pxf.outcome }}
          AUTO_TESTS: ${{ steps.automation_tests.outcome }}
        run: |
          set -eo pipefail

          status_icon() {
            case "$1" in
              success) echo "✅";;
              failure) echo "❌";;
              cancelled) echo "🛑";;
              skipped|"") echo "⏭️";;
              *) echo "$1";;
            esac
          }

          BCLI_ICON=$(status_icon "${BUILD_CLI}")
          BFDW_ICON=$(status_icon "${BUILD_FDW}")
          BEXT_ICON=$(status_icon "${BUILD_EXTERNAL}")
          BSRV_ICON=$(status_icon "${BUILD_SERVER}")
          TCLI_ICON=$(status_icon "${TEST_CLI}")
          TFDW_ICON=$(status_icon "${TEST_FDW}")
          TEXT_ICON=$(status_icon "${TEST_EXTERNAL}")
          TSRV_ICON=$(status_icon "${TEST_SERVER}")

          {
            echo "## PXF Module Build/Test Results"
            echo ""
            echo "| Module | Build | Test |"
            echo "|-------:|:-----:|:----:|"
            echo "| CLI | ${BCLI_ICON} (${BUILD_CLI:-skipped}) | ${TCLI_ICON} (${TEST_CLI:-skipped}) |"
            echo "| FDW | ${BFDW_ICON} (${BUILD_FDW:-skipped}) | ${TFDW_ICON} (${TEST_FDW:-skipped}) |"
            echo "| External-Table | ${BEXT_ICON} (${BUILD_EXTERNAL:-skipped}) | ${TEXT_ICON} (${TEST_EXTERNAL:-skipped}) |"
            echo "| Server | ${BSRV_ICON} (${BUILD_SERVER:-skipped}) | ${TSRV_ICON} (${TEST_SERVER:-skipped}) |"
            echo ""
            echo "### Install/Start/Automation"
            IN_ICON=$(status_icon "${INSTALL_PXF}") ; ST_ICON=$(status_icon "${START_PXF}") ; AT_ICON=$(status_icon "${AUTO_TESTS}")
            echo "| Step | Status |"
            echo "|-----:|:------:|"
            echo "| Install PXF | ${IN_ICON} (${INSTALL_PXF:-skipped}) |"
            echo "| Start PXF | ${ST_ICON} (${START_PXF:-skipped}) |"
            echo "| Automation Tests | ${AT_ICON} (${AUTO_TESTS:-skipped}) |"
            echo ""
            echo "### Logs and Reports"
            echo "- Server Gradle test reports: \`~/cloudberry-pxf/server/build/reports/tests/test\`"
            echo "- Automation test reports: \`~/cloudberry-pxf/automation/*/reports\`"
            echo "- PXF runtime logs: \`~/pxf-base/log\`"
            echo "- Uploaded artifact bundle: 'pxf-build-install-test-artifacts'"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          for v in "${BUILD_CLI}" "${BUILD_FDW}" "${BUILD_EXTERNAL}" "${BUILD_SERVER}" \
                   "${TEST_CLI}" "${TEST_FDW}" "${TEST_EXTERNAL}" "${TEST_SERVER}" \
                   "${INSTALL_PXF}" "${START_PXF}" "${AUTO_TESTS}"; do
            if [ "$v" = "failure" ]; then fail=1; fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "One or more modules failed. Marking job as failed."
            exit 1
          fi

  notify-status:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [pxf-build-install-test]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "PXF CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- PXF Build & Test: ${{ needs.pxf-build-install-test.result }}" >> $GITHUB_STEP_SUMMARY
