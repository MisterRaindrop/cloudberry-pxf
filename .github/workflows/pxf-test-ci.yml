name: PXF Test CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "11"
  JAVA_HOME: "/usr/lib/jvm/java-11-openjdk"
  GPADMIN_HOME: "/home/gpadmin"
  GO_VERSION: "1.21"
  GPHOME: "/usr/local/cloudberry-db"
  CLOUDBERRY_VERSION: "main"
  PXF_HOME: "/usr/local/pxf"
  PXF_VERSION: "main"
  # Common environment setup script
  SETUP_ENV_SCRIPT: |
    if [ -f "/usr/local/cloudberry-db/cloudberry-env.sh" ]; then
      source /usr/local/cloudberry-db/cloudberry-env.sh
    fi
    export GPHOME=/usr/local/cloudberry-db
    export PXF_HOME=/usr/local/pxf
    export JAVA_HOME=${JAVA_HOME:-/usr/lib/jvm/java-11-openjdk}
    export CLOUDBERRY_SRC="${GITHUB_WORKSPACE}/cloudberry"
    export PATH="$PATH:/usr/local/go/bin:${GPHOME}/bin"
    export LD_LIBRARY_PATH="${GPHOME}/lib:${LD_LIBRARY_PATH}"
    echo "GPHOME=$GPHOME" >> "$GITHUB_ENV"
    echo "PXF_HOME=$PXF_HOME" >> "$GITHUB_ENV"
    echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
    echo "CLOUDBERRY_SRC=$CLOUDBERRY_SRC" >> "$GITHUB_ENV"
    echo "PATH=$PATH" >> "$GITHUB_ENV"
    echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

jobs:
  build-hadoop-services:
    name: Build Hadoop Services Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current PXF source
        uses: actions/checkout@v4
        with:
          path: cloudberry-pxf

      - name: Build singlecluster image
        working-directory: cloudberry-pxf/automation
        run: |
          echo "Building pxf/singlecluster:3 image..."
          docker build -f docker/singlecluster/Dockerfile -t pxf/singlecluster:3 .

      - name: Save images to cache
        run: |
          mkdir -p /tmp/docker-images
          docker save pxf/singlecluster:3 | gzip > /tmp/docker-images/singlecluster.tar.gz

      - name: Cache Docker images
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: pxf-docker-images-${{ github.sha }}
          restore-keys: |
            pxf-docker-images-

  pxf-build-install-test:
    name: Build, Install & Test PXF
    runs-on: ubuntu-latest
    needs: [build-hadoop-services]
    steps:
      - name: Create shared network
        run: |
          docker network create pxf-test-network
      - name: Deploy Cloudberry
        run: |
          docker run -d \
              --user root \
              --hostname cdw \
              --shm-size=2gb \
              --ulimit core=-1 \
              --name cloudberry-pxf \
              --network pxf-test-network \
              apache/incubator-cloudberry:cbdb-build-rocky9-latest \
              tail -f /dev/null
      - name: Cloudberry Environment Initialization
        run: |
          docker exec cloudberry-pxf bash -c "
            # Initialize container environment like in pxf-ci.yml
            if ! su - gpadmin -c '/tmp/init_system.sh'; then
              echo 'Container initialization failed'
              exit 1
            fi

            # Create necessary directories and set permissions
            mkdir -p build-logs/details
            chown -R gpadmin:gpadmin . > /dev/null 2>&1
            chmod -R 755 . > /dev/null 2>&1
            chmod 777 build-logs
          "
      - name: Checkout Apache Cloudberry source
        env:
          SRC_DIR: ${{ github.workspace }}/cloudberry
        run: |
          docker exec cloudberry-pxf bash -c "
            set -eo pipefail
            mkdir -p /home/gpadmin/
            chown -R gpadmin:gpadmin /home/gpadmin/
            cd /home/gpadmin/
            git clone --depth 1 --recurse-submodules https://github.com/apache/cloudberry.git cloudberry
            chown -R gpadmin:gpadmin cloudberry
            chmod -R 755 cloudberry
          "
      - name: Configure Apache Cloudberry
        env:
          SRC_DIR: ${{ github.workspace }}/cloudberry
          BUILD_DESTINATION: /usr/local/cloudberry-db
          LOGS_DIR: build-logs
        run: |
          docker exec cloudberry-pxf bash -c "
            set -eo pipefail
            export SRC_DIR='/home/gpadmin/cloudberry'
            export LOGS_DIR='build-logs'

            chown root:root /usr/bin/sudo
            chmod 4755 /usr/bin/sudo
            chown root:root /usr/libexec/sudo/sudoers.so
            chown root:root /etc/sudo.conf
            chown root:root /etc/sudoers
            chmod 644 /etc/sudo.conf
            chmod 440 /etc/sudoers
            chown root:root /etc/sudoers.d
            chmod 755 /etc/sudoers.d
            chown root:root /etc/sudoers.d/*
            chmod 440 /etc/sudoers.d/*

            if [ -f /usr/bin/visudo ]; then
                chown root:root /usr/bin/visudo
                chmod 4755 /usr/bin/visudo
            elif [ -f /usr/sbin/visudo ]; then
                chown root:root /usr/sbin/visudo
                chmod 4755 /usr/sbin/visudo
            fi

            echo 'gpadmin ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

            mkdir -p \"\${SRC_DIR}/\${LOGS_DIR}\" \"\${SRC_DIR}/\${LOGS_DIR}/details\"
            chown -R gpadmin:gpadmin \"\${SRC_DIR}\"
            chmod -R 755 \"\${SRC_DIR}\"
            chmod 777 \"\${SRC_DIR}/\${LOGS_DIR}\"
            chmod +x /home/gpadmin/cloudberry/devops/build/automation/cloudberry/scripts/configure-cloudberry.sh
            if ! time su - gpadmin -c 'cd /home/gpadmin/cloudberry && SRC_DIR=/home/gpadmin/cloudberry ENABLE_DEBUG=false /home/gpadmin/cloudberry/devops/build/automation/cloudberry/scripts/configure-cloudberry.sh'; then
              echo 'Configure script failed'
              exit 1
            fi
          "
      - name: Build Apache Cloudberry
        env:
          SRC_DIR: ${{ github.workspace }}/cloudberry
        run: |
          docker exec cloudberry-pxf bash -c "
            set -eo pipefail
            export SRC_DIR='/home/gpadmin/cloudberry'
            chmod +x /home/gpadmin/cloudberry/devops/build/automation/cloudberry/scripts/build-cloudberry.sh
            if ! time su - gpadmin -c 'cd /home/gpadmin/cloudberry && SRC_DIR=/home/gpadmin/cloudberry /home/gpadmin/cloudberry/devops/build/automation/cloudberry/scripts/build-cloudberry.sh'; then
              echo 'Build script failed'
              exit 1
            fi
          "
      - name: Checkout PXF source code in container
        run: |
          docker exec cloudberry-pxf bash -c "
            su - gpadmin -c '
              cd /home/gpadmin/
              if [ ! -d cloudberry-pxf ]; then
                git clone https://github.com/MisterRaindrop/cloudberry-pxf.git cloudberry-pxf
                cd cloudberry-pxf
              fi
            '
          "
      - name: Build and Install PXF in container
        run: |
          docker exec cloudberry-pxf bash -c "
            # Install additional build dependencies
            dnf install -y --allowerasing golang gcc gcc-c++ curl-devel postgresql-devel
            
            su - gpadmin -c '
              set -eo pipefail
              export GPHOME=/usr/local/cloudberry-db
              export PATH=\$GPHOME/bin:\$PATH
              source \$GPHOME/cloudberry-env.sh
              
              cd cloudberry-pxf
              
              # Build all PXF components
              make all
              
              # Install PXF
              make install
              
              # Set up PXF environment
              export PXF_HOME=/usr/local/pxf
              export PXF_BASE=\$HOME/pxf-base
              export PATH=\$PXF_HOME/bin:\$PATH
              
              # Initialize PXF
              pxf prepare
              pxf start
              
              # Verify PXF is running
              pxf status
            '
          "

      - name: Create Cloudberry demo cluster
        env:
          SRC_DIR: ${{ github.workspace }}/cloudberry
          NUM_PRIMARY_MIRROR_PAIRS: 1
        run: |
          docker exec cloudberry-pxf bash -c "
            set -eo pipefail
            chown root:root /usr/bin/sudo
            chmod 4755 /usr/bin/sudo
            chown root:root /usr/libexec/sudo/sudoers.so
            chown root:root /etc/sudo.conf
            chown root:root /etc/sudoers
            chmod 644 /etc/sudo.conf
            chmod 440 /etc/sudoers
            chown root:root /etc/sudoers.d
            chmod 755 /etc/sudoers.d
            chown root:root /etc/sudoers.d/*
            chmod 440 /etc/sudoers.d/*

            if [ -f /usr/bin/visudo ]; then
                chown root:root /usr/bin/visudo
                chmod 4755 /usr/bin/visudo
            elif [ -f /usr/sbin/visudo ]; then
                chown root:root /usr/sbin/visudo
                chmod 4755 /usr/sbin/visudo
            fi

            su - gpadmin -c '
              set -eo pipefail
              export SRC_DIR='/home/gpadmin/cloudberry'

              chmod 700 ~/.ssh
              chmod 600 ~/.ssh/authorized_keys
              chmod 600 ~/.ssh/id_rsa
              chmod 644 ~/.ssh/id_rsa.pub
              chmod 644 ~/.ssh/known_hosts

              sudo ls -la /usr/share/empty.sshd/
              sudo chown root:root /usr/share/empty.sshd/
              sudo chmod 755 /usr/share/empty.sshd/
              echo \"Updated permissions:\"
              sudo ls -la /usr/share/empty.sshd/

              cd /home/gpadmin/cloudberry
              export NUM_PRIMARY_MIRROR_PAIRS=1
              chmod +x /home/gpadmin/cloudberry/devops/build/automation/cloudberry/scripts/create-cloudberry-demo-cluster.sh
              /home/gpadmin/cloudberry/devops/build/automation/cloudberry/scripts/create-cloudberry-demo-cluster.sh
            '
          "
      - name: Verify Cloudberry cluster
        run: |
          docker exec cloudberry-pxf bash -c "
            set -eo pipefail
            su - gpadmin -c '
              export SRC_DIR='/home/gpadmin/cloudberry'
              source /usr/local/cloudberry-db/cloudberry-env.sh
              source /home/gpadmin/cloudberry/gpAux/gpdemo/gpdemo-env.sh
              gpstate -s
              psql -d postgres -c \"SELECT version();\"
              psql -d postgres -c \"SELECT * FROM gp_segment_configuration;\"
            '
          "
      - name: Create shared network
        run: docker network create pxf-test-network
      - name: Restore Docker images from cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-images
          key: pxf-docker-images-${{ github.sha }}
          restore-keys: |
            pxf-docker-images-

      - name: Load and start Hadoop services container
        run: |
          # Restore and load Docker images
          if [ -f /tmp/docker-images/singlecluster.tar.gz ]; then
            echo "Loading singlecluster image..."
            docker load < /tmp/docker-images/singlecluster.tar.gz
            docker images | grep singlecluster
          else
            echo "No cached singlecluster image found"
            exit 1
          fi

          # Start Hadoop services container
          echo "Starting Hadoop services container..."
          docker run -d \
            --name hadoop-services \
            --hostname hadoop-services \
            --network pxf-test-network \
            -p 9000:9000 \
            -p 9870:9870 \
            -p 8088:8088 \
            -p 2181:2181 \
            -p 9083:9083 \
            -p 16000:16000 \
            -p 16010:16010 \
            pxf/singlecluster:3

          # Wait for services to be ready
          echo "Waiting for Hadoop services to be ready..."
          timeout 300 bash -c 'until docker exec hadoop-services nc -z localhost 9000; do sleep 10; done'
          echo "Hadoop services are ready!"
      - name: Configure Hadoop services connection
        run: |
          su - gpadmin -c "
            # Configure Hadoop connection to services
            export GPHD_ROOT=/tmp/hadoop-services
            mkdir -p \$GPHD_ROOT/conf

            # Create configuration files pointing to service containers
            cat > \$GPHD_ROOT/conf/core-site.xml << EOF
            <?xml version=\"1.0\"?>
            <configuration>
              <property>
                <name>fs.defaultFS</name>
                <value>hdfs://hadoop-services:9000</value>
              </property>
            </configuration>
            EOF

            cat > \$GPHD_ROOT/conf/hbase-site.xml << EOF
            <?xml version=\"1.0\"?>
            <configuration>
              <property>
                <name>hbase.zookeeper.quorum</name>
                <value>hadoop-services:2181</value>
              </property>
            </configuration>
            EOF
          "

      - name: Wait for Hadoop services to be ready
        run: |
          echo "Waiting for Hadoop services to be ready..."
          timeout 300 bash -c 'until nc -z hadoop-services 9000; do sleep 5; done'
          timeout 300 bash -c 'until nc -z hadoop-services 2181; do sleep 5; done'
          timeout 300 bash -c 'until nc -z hadoop-services 16000; do sleep 5; done'
          echo "All Hadoop services are ready!"
