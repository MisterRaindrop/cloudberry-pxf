name: PXF CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "11"
  JAVA_HOME: "/usr/lib/jvm/java-11-openjdk"
  GPADMIN_HOME: "/home/gpadmin"
  GO_VERSION: "1.21"
  GPHOME: "/usr/local/cloudberry-db"
  CLOUDBERRY_VERSION: "main"
  PXF_HOME: "/usr/local/pxf"
  PXF_VERSION: "main"

jobs:
  pxf-build-install-test:
    name: Build, Install & Test PXF
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Apache Cloudberry source
      uses: actions/checkout@v4
      with:
        repository: apache/cloudberry
        ref: main
        fetch-depth: 1
        persist-credentials: false
        path: cloudberry
        submodules: true
    - name: Checkout Apache Cloudberry pxf source
      uses: actions/checkout@v4
      with:
        repository: apache/cloudberry-pxf
        ref: main
        fetch-depth: 1
        persist-credentials: false
        path: cloudberry-pxf
        submodules: true
    - name: Run Test
      run: |
        cd ${{ github.workspace }}/cloudberry-pxf/concourse/docker/pxf-cbdb-dev/ubuntu/
        docker compose up -d
        # Wait for container to be ready
        sleep 10
        # Execute entrypoint script with correct working directory
        docker compose exec -T pxf-cbdb-dev /bin/bash -c "cd /home/gpadmin/workspace/cloudberry-pxf/concourse/docker/pxf-cbdb-dev/ubuntu && ./script/entrypoint.sh"
    - name: Extract test artifacts from container
      if: always()
      run: |
        cd cloudberry-pxf/concourse/docker/pxf-cbdb-dev/ubuntu/
        mkdir -p ../../../../automation/test_artifacts/surefire-reports
        mkdir -p ../../../../automation/test_artifacts/automation_logs
        mkdir -p ../../../../automation/test_artifacts/pxf_regress
        
        # Extract main test reports with preserved structure
        docker compose cp pxf-cbdb-dev:/home/gpadmin/workspace/cloudberry-pxf/automation/target/surefire-reports ../../../../automation/test_artifacts/ || echo "No surefire-reports found"
        docker compose cp pxf-cbdb-dev:/home/gpadmin/workspace/cloudberry-pxf/automation/automation_logs ../../../../automation/test_artifacts/ || echo "No automation_logs found"
        
        # Extract additional test results for debugging with preserved structure
        docker compose cp pxf-cbdb-dev:/home/gpadmin/workspace/cloudberry-pxf/regression/pxf_regress ../../../../automation/test_artifacts/ || echo "No pxf_regress found"
        
        # Collect artifacts from entrypoint script
        docker compose cp pxf-cbdb-dev:/home/gpadmin/artifacts ../../../../ || echo "No artifacts found"
        
        echo "Extracted artifacts:"
        ls -la ../../../../automation/test_artifacts/ || echo "No test_artifacts directory"
        
    - name: Cleanup containers
      if: always()
      run: |
        cd cloudberry-pxf/concourse/docker/pxf-cbdb-dev/ubuntu/
        docker compose down -v || true


    - name: Save artifacts
      if: always()
      uses: actions/upload-artifact@v4
      id: upload_automation_step
      with:
        name: automation-test-results-pxf-cbdb-dev
        path: |
          ./automation/test_artifacts/surefire-reports
          ./automation/test_artifacts/automation_logs
          ./automation/test_artifacts/pxf_regress
          ./automation/test_artifacts/sqlrepo
          ./artifacts
        retention-days: 30

    - name: Evaluate module build/test results
      if: success() || failure()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          console.log('Processing test reports for PXF...');
          
          // Start building the step summary
          const summary = core.summary
            .addHeading('PXF Test Results Summary')
            .addHeading('📦 Artifacts', 3)
            .addLink('Raw Test Results', "${{ steps.upload_automation_step.outputs.artifact-url }}");
          
          let hasErrors = false;
          
          // Check if test reports exist
          const testReportsDir = './automation/test_artifacts/surefire-reports';
          if (!fs.existsSync(testReportsDir)) {
            core.error('No test reports found for PXF');
            summary.addRaw('No test reports available\n\n');
            hasErrors = true;
          }
          
          // Process TestNG XML results
          const testngResultsPath = path.join(testReportsDir, 'testng-results.xml');
          if (fs.existsSync(testngResultsPath)) {
            try {
              const xmlContent = fs.readFileSync(testngResultsPath, 'utf8');
            
              // Extract test statistics using regex
              const totalMatch = xmlContent.match(/total="(\d+)"/);
              const passedMatch = xmlContent.match(/passed="(\d+)"/);
              const failedMatch = xmlContent.match(/failed="(\d+)"/);
              const skippedMatch = xmlContent.match(/skipped="(\d+)"/);
            
              const total = totalMatch ? totalMatch[1] : '0';
              const passed = passedMatch ? passedMatch[1] : '0';
              const failed = failedMatch ? failedMatch[1] : '0';
              const skipped = skippedMatch ? skippedMatch[1] : '0';
            
              // Add test statistics to summary
              summary
                .addRaw(`\n\nTest Results:\n\n`)
                .addRaw(`Total: ${total}\n\n`)
                .addRaw(`Passed: ${passed}\n\n`)
                .addRaw(`Failed: ${failed}\n\n`)
                .addRaw(`Skipped: ${skipped}\n\n`)
            
              // Check if there are failed or skipped tests
              const failedCount = parseInt(failed) || 0;
              const skippedCount = parseInt(skipped) || 0;
            
              if (failedCount > 0) {
                core.error(`Test execution failed: ${failedCount} test(s) failed`);
                hasErrors = true;
              }
              if (skippedCount > 0) {
                core.warning(`Test execution incomplete: ${skippedCount} test(s) skipped`);
              }
            } catch (error) {
              console.log('Error processing TestNG results:', error.message);
              core.error('Error processing test results');
              hasErrors = true;
            }
          }
          
          // Write to step summary
          await summary.write();
          
          // Exit with error code if there were errors
          if (hasErrors) {
            process.exit(1);
          }



